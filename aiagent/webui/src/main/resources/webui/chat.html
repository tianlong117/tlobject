<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent Web</title>
<link rel="stylesheet" href="/webui/style.css">
</head>
<body>

<!-- ===== 登录视图 ===== -->
<div id="loginView">
  <div class="login-box">
    <h1>🤖 AI Agent Web</h1>
    <p class="sub">消息框架 Web 交互窗口</p>
    <input id="loginUser" placeholder="用户ID" autocomplete="username">
    <input id="loginPwd" type="password" placeholder="密码（如已配置）" autocomplete="current-password">
    <button id="loginBtn">登 录</button>
    <div id="loginErr" class="err hidden"></div>
  </div>
</div>

<!-- ===== 主界面 ===== -->
<div id="chatView" class="hidden">
  <header>
    <span class="brand">🤖 AI Agent Web</span>
    <span id="userTag" class="tag"></span>
    <span class="sess">会话 <input id="sessionId" size="26" title="当前会话ID（可改，改后按新ID开新会话）"></span>
    <label class="toggle"><input type="checkbox" id="streamToggle" checked> 流式</label>
    <span id="connState" class="conn" title="事件通道连接状态">●</span>
    <button id="tasksBtn" class="ghost" title="定时任务（查看/暂停/恢复/删除）">📋 定时任务</button>
    <button id="bgTasksBtn" class="ghost" title="后台任务（跨会话查看/停止/删除）">🚀 后台任务</button>
    <button id="inboxBtn" class="ghost" title="消息箱（离线任务结果与通知）">🔔 消息箱<span id="inboxBadge" class="badge hidden">0</span></button>
    <button id="logoutBtn" class="ghost">退出</button>
  </header>
  <main>
    <!-- 左侧常驻会话栏：会话列表 + 状态标记（● 运行中 / ○ 未读）+ 新会话（原先在右侧"会话"Tab 里） -->
    <aside id="sessionPane">
      <div class="btn-row sess-tools">
        <button class="primary" onclick="newSession()">＋ 新会话</button>
        <button onclick="refreshSessionList()">刷新</button>
        <button onclick="resumeCheckpoint()">断点恢复</button>
      </div>
      <div id="sessionsBox" class="box"></div>
    </aside>

    <!-- 聊天窗口 -->
    <section id="chatPane">
      <div id="msgList"></div>
      <!-- 上传成功文件名条 -->
      <div id="uploadBar" class="hidden">
        <span class="ub-label">📎 已上传</span>
        <span id="uploadChips"></span>
        <button id="clearUploads" type="button" class="ub-clear">✕ 清除</button>
      </div>
      <div class="chat-input">
        <textarea id="chatInput" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <div class="chat-btns">
          <button id="attachBtn" type="button" title="上传文件（可多选，单个 ≤50MB）">📎</button>
          <label id="bgToggleWrap" title="把这条消息挂到后台执行（不阻塞对话）">
            <input type="checkbox" id="bgToggle"> 后台执行
          </label>
          <button id="sendBtn">发送</button>
          <button id="stopBtn" class="hidden danger">■ 停止</button>
        </div>
      </div>
    </section>

    <!-- 命令面板（调试/测试用；会话列表已移到左侧常驻栏） -->
    <aside id="panelPane">
      <nav id="tabBar">
        <button data-tab="tab-agents" class="active">Agent/Skill</button>
        <button data-tab="tab-mcp">MCP</button>
        <button data-tab="tab-eval">评测/测试</button>
        <button data-tab="tab-trace">追踪</button>
      </nav>

      <section id="tab-agents" class="tab-panel active">
        <div class="btn-row">
          <button class="primary" onclick="loadAgents()">Agents</button>
          <button onclick="loadSkills()">Skills</button>
        </div>
        <div id="agentsBox" class="box"></div>
        <div id="opMsg" class="box"></div>
        <!-- 参数查看 / 卸载 / 重载 已并入列表每行的"操作"列（参数自动带家族名，无需手输） -->
        <details class="mini">
          <summary>安装</summary>
          <div class="row">
            <select id="installType">
              <option value="skill">Skill(脚本目录)</option>
              <option value="agent">Agent</option>
              <option value="baseSkill">BaseSkill(Java类)</option>
            </select>
            <input id="installName" placeholder="名称/目录">
          </div>
          <div class="row">
            <input id="installRef" placeholder="sameClassAs 或 classFile(含. 的视为类名，可选)">
            <input id="installTarget" placeholder="目标Agent (默认 aiagent_master)">
          </div>
          <button class="primary" onclick="doInstall()">安装</button>
        </details>
      </section>

      <section id="tab-mcp" class="tab-panel">
        <div class="row">
          <input id="mcpKw" placeholder="搜索关键词 (空=全部精选)">
          <button class="primary" onclick="mcpSearch()">搜索</button>
        </div>
        <div id="mcpSearchBox" class="box"></div>
        <div class="btn-row">
          <button onclick="mcpList()">已安装列表</button>
        </div>
        <div id="mcpListBox" class="box"></div>
      </section>

      <section id="tab-eval" class="tab-panel">
        <div class="btn-row">
          <button class="primary" onclick="evalCmd('suite')">suite 全部</button>
          <button onclick="evalCmd('list')">list 用例</button>
          <button onclick="evalCmd('quick')">quick 自检</button>
        </div>
        <div class="row">
          <input id="evalCase" placeholder="caseId"><button onclick="evalCmd('run')">run</button>
          <input id="evalAgent" placeholder="agent(可选)"><button onclick="evalCmd('cascade')">cascade</button>
        </div>
        <div id="evalBox" class="box"></div>
        <hr>
        <div class="btn-row">
          <button class="primary" onclick="testCmd('list')">测试用例列表</button>
          <button onclick="testCmd('all')">运行全部</button>
        </div>
        <div class="row">
          <input id="testCase" placeholder="用例名 (如 basicChat)"><button onclick="testCmd('one')">运行</button>
        </div>
        <div id="testBox" class="box"></div>
      </section>

      <section id="tab-trace" class="tab-panel">
        <div class="btn-row">
          <button class="primary" onclick="doTrace()">/trace 环节记录</button>
          <button onclick="doTraceLlm()">/trace llm 完整链路</button>
          <button onclick="doStats()">/stats 会话统计</button>
          <button onclick="doStatsAll()">/stats all</button>
          <button onclick="doStatsAgent()">/stats agent</button>
        </div>
        <div id="traceBox" class="box"></div>
        <div id="replayResult" class="box"></div>
      </section>
    </aside>
  </main>
</div>

<!-- ===== 审批弹框 ===== -->
<div id="approvalModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="apTitle"></h3>
    <div id="apDesc" class="ap-desc"></div>
    <label class="lbl">工具参数（可编辑后批准）</label>
    <textarea id="apArgs" rows="6" spellcheck="false"></textarea>
    <div class="btn-row">
      <button class="ok" id="apApproveBtn">✓ 批准</button>
      <button class="no" id="apRejectBtn">✗ 拒绝</button>
    </div>
    <input id="apReason" placeholder="拒绝原因（可选）">
    <div id="apMsg" class="err hidden"></div>
  </div>
</div>

<!-- ===== 定时任务浮层（顶栏 📋 打开）===== -->
<div id="tasksModal" class="modal hidden">
  <div class="modal-box wide">
    <h3>📋 定时任务</h3>
    <div class="btn-row">
      <button class="primary" onclick="loadTasks()">刷新</button>
    </div>
    <div id="tasksBox" style="max-height:60vh;overflow:auto;"></div>
    <div class="btn-row">
      <button class="ok" onclick="closeTasks()">关 闭</button>
    </div>
  </div>
</div>

<!-- ===== 后台任务浮层（顶栏 🚀 打开；跨会话查看全部后台任务）===== -->
<div id="bgTasksModal" class="modal hidden">
  <div class="modal-box wide">
    <h3>🚀 后台任务</h3>
    <div class="btn-row">
      <button class="primary" onclick="loadBgTasks()">刷新</button>
    </div>
    <div id="bgTasksBox" style="max-height:60vh;overflow:auto;"></div>
    <div class="btn-row">
      <button class="ok" onclick="closeBgTasks()">关 闭</button>
    </div>
  </div>
</div>

<!-- ===== 消息箱浮层（顶栏 🔔 打开）===== -->
<div id="inboxModal" class="modal hidden">
  <div class="modal-box wide">
    <h3>🔔 消息箱</h3>
    <div class="btn-row">
      <button class="primary" onclick="loadInbox()">刷新</button>
      <button onclick="readAllInbox()">全部已读</button>
    </div>
    <div id="inboxBox" style="max-height:60vh;overflow:auto;"></div>
    <div class="btn-row">
      <button class="ok" onclick="closeInbox()">关 闭</button>
    </div>
  </div>
</div>

<div id="paramModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="pmTitle"></h3>
    <div id="pmBody" style="max-height:60vh;overflow:auto;"></div>
    <div class="btn-row">
      <button class="ok" onclick="closeParam()">关 闭</button>
    </div>
  </div>
</div>

<!-- ===== 通用确认弹框（confirmDialog() 动态填入，评测等"点了就会真的跑"的操作先问一句） ===== -->
<div id="confirmModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="cfTitle"></h3>
    <div id="cfText" class="ap-desc"></div>
    <div class="btn-row">
      <button class="ok" id="cfOkBtn">确 定</button>
      <button class="no" id="cfCancelBtn">取 消</button>
    </div>
  </div>
</div>

<!-- ===== 断点恢复提示（登录后检测到上次未正常结束的会话，仿命令行启动提示） ===== -->
<div id="checkpointModal" class="modal hidden">
  <div class="modal-box">
    <h3>⚠ 检测到上次未正常结束的会话</h3>
    <div id="cpDesc" class="ap-desc"></div>
    <div class="btn-row">
      <button class="ok" id="cpResumeBtn">▶ 恢复执行</button>
      <button class="no" id="cpIgnoreBtn">忽略，开始新对话</button>
    </div>
  </div>
</div>

<!-- ===== 后台任务详情抽屉（body 级：会话 box 与侧栏重建都不影响它） ===== -->
<div id="taskDrawer" class="hidden">
  <div class="td-head"><span id="taskDrawerTitle"></span>
    <button id="tdStop">停止</button><button id="tdClose">✕</button></div>
  <pre id="taskDrawerBody"></pre>
</div>

<div id="toastBox"></div>
<input type="file" id="fileInput" multiple hidden>

<script src="/webui/app.js"></script>
</body>
</html>
