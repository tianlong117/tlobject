<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent 管理</title>
<link rel="stylesheet" href="/webui/manage.css">
</head>
<body>

<!-- 管理页面（独立页面；/webui/manage.html，从对话页顶栏「管理」新标签打开） -->
<div id="manageApp" class="m-app hidden">
  <header class="m-header">
    <span class="m-brand">🗂 AI Agent 管理</span>
    <span id="mUser" class="m-user"></span>
  </header>
  <div class="m-body">
    <aside class="m-side">
      <div class="m-side-title">管理功能</div>
      <button class="m-nav active" data-view="workspace">📁 工作空间管理</button>
      <button class="m-nav" data-view="users" id="mNavUsers">👤 用户管理</button>
      <button class="m-nav" data-view="registration" id="mNavRegistration">📝 注册管理</button>
      <div class="m-side-note">更多管理功能后续接入</div>
    </aside>
    <main class="m-main">
      <div id="workspaceView" class="m-view">
        <div class="m-title">
          <h2>工作空间管理</h2>
          <span id="mSummary" class="m-muted"></span>
        </div>
        <div id="mBreadcrumb" class="m-breadcrumb"></div>
        <div class="m-toolbar">
          <button id="mUploadBtn" class="m-primary" type="button" title="上传文件到当前文件夹（可多选）">上传文件</button>
          <input id="mUploadInput" type="file" multiple class="hidden">
          <button id="mNewFolderBtn" class="m-secondary" type="button">新建文件夹</button>
          <button id="mRefresh" class="m-secondary" type="button">刷新</button>
          <input id="mFilter" placeholder="按文件名筛选">
          <button id="mDeleteSelected" class="m-danger" type="button" disabled>删除选中</button>
          <span id="mCount" class="m-muted"></span>
        </div>
        <div id="mNotice" class="m-notice hidden"></div>
        <div id="mList" class="m-list"></div>
      </div>
      <div id="usersView" class="m-view hidden">
        <div class="m-title">
          <h2>用户管理</h2>
          <span id="mUserSummary" class="m-muted"></span>
        </div>
        <div class="m-toolbar">
          <input id="mUserFilter" placeholder="搜索登录名/昵称/邮箱">
          <select id="mUserStatus">
            <option value="">全部状态</option>
            <option value="1">启用</option>
            <option value="0">禁用</option>
            <option value="2">待审核</option>
          </select>
          <button id="mUserNew" class="m-primary" type="button">新建用户</button>
          <button id="mUserRefresh" class="m-secondary" type="button">刷新</button>
        </div>
        <div id="mUserNotice" class="m-notice hidden"></div>
        <div id="mUserList" class="m-list"></div>
        <div class="m-pager">
          <button id="mUserPrev" class="m-secondary" type="button">上一页</button>
          <span id="mUserPageInfo" class="m-muted"></span>
          <button id="mUserNext" class="m-secondary" type="button">下一页</button>
        </div>
      </div>
      <div id="registrationView" class="m-view hidden">
        <div class="m-title">
          <h2>注册管理</h2>
          <span id="mRegSettingsInfo" class="m-muted"></span>
        </div>
        <div class="m-toolbar">
          <label class="m-check-line"><input id="mRegAllow" type="checkbox" checked> 允许自助注册</label>
          <label class="m-check-line"><input id="mRegNeedApproval" type="checkbox"> 注册后需管理员审核</label>
          <label class="m-check-line"><input id="mRegLoginCaptcha" type="checkbox" checked> 登录/注册需要验证码</label>
          <button id="mRegSave" class="m-primary" type="button">保存设置</button>
        </div>
        <div id="mRegNotice" class="m-notice hidden"></div>
        <div class="m-title">
          <h2>待审核用户</h2>
          <span id="mPendingCount" class="m-muted"></span>
        </div>
        <div class="m-toolbar">
          <button id="mPendingRefresh" class="m-secondary" type="button">刷新</button>
        </div>
        <div id="mPendingList" class="m-list"></div>
        <div class="m-pager">
          <button id="mPendingPrev" class="m-secondary" type="button">上一页</button>
          <span id="mPendingPageInfo" class="m-muted"></span>
          <button id="mPendingNext" class="m-secondary" type="button">下一页</button>
        </div>
      </div>
    </main>
  </div>

<div id="mUserModal" class="m-modal hidden">
  <div class="m-modal-box">
    <div class="m-modal-head">
      <span id="mUserModalTitle">新建用户</span>
      <button id="mUserModalClose" class="m-modal-x" type="button">✕</button>
    </div>
    <div class="m-modal-body">
      <label class="m-label">登录名</label>
      <input id="muId" maxlength="32" placeholder="2-32 位字母/数字/下划线/短横线">
      <label class="m-label">昵称</label>
      <input id="muNickname" maxlength="32">
      <label class="m-label">密码</label>
      <input id="muPassword" type="password" autocomplete="new-password" maxlength="64" placeholder="新建时必填；编辑时留空不改">
      <label class="m-label">角色（逗号分隔）</label>
      <input id="muRoles" placeholder="如 member,admin">
      <label class="m-label">Group</label>
      <input id="muGroup" maxlength="64">
      <label class="m-label">邮箱</label>
      <input id="muEmail" maxlength="128">
      <label class="m-label">一句话介绍</label>
      <input id="muBio" maxlength="200">
      <label class="m-label">状态</label>
      <select id="muStatus"></select>
      <div id="mUserErr" class="err hidden"></div>
      <button id="mUserSave" class="m-primary" type="button">保存</button>
    </div>
  </div>
</div>
</div>

<div id="mLogin" class="m-login hidden">
  <div class="m-login-box">
    <h1>🗂 AI Agent 管理</h1>
    <p>未登录或会话已失效。</p>
    <p><a href="/webui/chat.html">返回登录 / 对话</a></p>
  </div>
</div>

<script src="/webui/manage.js"></script>
</body>
</html>
